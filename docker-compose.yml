services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: tokobun
      POSTGRES_PASSWORD: tokobun
      POSTGRES_DB: tokobun
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokobun"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  pgdata:
